<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style>
<iframe id="f" src="../index.html"></iframe>
<script>{ const q = new URLSearchParams(location.search); if (q.get("page")) f.src = "../index.html?" + q.get("page"); if (q.get("w")) { f.style.width = q.get("w") + "px"; f.style.height = q.get("h") + "px"; } }</script>
<script>
// screenshot helper: ?state=tape|menu|manual|catalogue shows the page in that state
const q = new URLSearchParams(location.search), st = q.get('state');
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  await new Promise(r => setTimeout(r, 800));
  if (st === 'tape' || st === 'menu') {
    w.loadFile('hello.tap', new Uint8Array(await (await fetch('hello.tap')).arrayBuffer()));
    w.eval('zx.tape.blockIdx = 1; zx.tape.pos = 4000; zx.tape.playing = true');
    d.getElementById('door').click();
  }
  if (st === 'menu') w.freeze(true);
  if (st === 'manual') d.getElementById('manualBook').click();
  if (st === 'touchjoy') d.getElementById('touchJoy').hidden = false;
  if (st === 'tapes') w.openTapesMenu();
  if (st === 'intro') w.openCatalogue();
  if (st === 'catalogue') { d.getElementById('rack').click(); d.querySelector('#catalogue input').value = q.get('q') || 'manic miner'; d.querySelector('#catalogue form').requestSubmit(); }
};
</script>
